naftiko: "1.0.0-alpha1"

info:
  label: "SuperTokens Core Driver Interface"
  description: "REST API exposed by supertokens-core for session management, user authentication, email verification, passwordless, third-party OAuth, user metadata, multi-tenancy, and role-based access control."
  tags:
    - SuperTokens
    - Authentication
    - Session Management
    - Identity
    - Open Source
    - Multi-Tenancy
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SUPERTOKENS_CORE_HOST: SUPERTOKENS_CORE_HOST
      SUPERTOKENS_API_KEY: SUPERTOKENS_API_KEY

capability:
  consumes:
    - type: http
      namespace: supertokens-cdi
      baseUri: "http://{{SUPERTOKENS_CORE_HOST}}:3567"
      description: "SuperTokens Core REST API"
      authentication:
        type: apikey
        key: api-key
        value: "{{SUPERTOKENS_API_KEY}}"
        placement: header
      resources:
        - name: health
          path: /hello
          description: "Service health check"
          operations:
            - name: get-health
              method: GET
              description: "Check if SuperTokens Core is running"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: sessions
          path: /recipe/session
          description: "Session lifecycle management"
          operations:
            - name: create-session
              method: POST
              description: "Create a new authentication session"
              body:
                type: json
                data:
                  userId: "{{tools.user_id}}"
                  userDataInJWT: "{{tools.jwt_data}}"
                  userDataInDatabase: "{{tools.db_data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-session
              method: GET
              description: "Verify and get session from access token"
              inputParameters:
                - name: accessToken
                  in: query
                  type: string
                  required: true
                  description: "Access token to verify"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: refresh-session
              method: POST
              description: "Refresh a session using refresh token"
              body:
                type: json
                data:
                  refreshToken: "{{tools.refresh_token}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: remove-sessions
              method: POST
              description: "Revoke sessions by handle or user ID"
              body:
                type: json
                data:
                  sessionHandles: "{{tools.session_handles}}"
                  userId: "{{tools.user_id}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: email-password
          path: /recipe
          description: "Email/password authentication"
          operations:
            - name: signup
              method: POST
              description: "Create new user with email and password"
              body:
                type: json
                data:
                  email: "{{tools.email}}"
                  password: "{{tools.password}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: signin
              method: POST
              description: "Authenticate user with email and password"
              body:
                type: json
                data:
                  email: "{{tools.email}}"
                  password: "{{tools.password}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-reset-password-token
              method: POST
              description: "Generate password reset token for user"
              body:
                type: json
                data:
                  userId: "{{tools.user_id}}"
                  email: "{{tools.email}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: reset-password
              method: POST
              description: "Reset user password using reset token"
              body:
                type: json
                data:
                  method: "token"
                  token: "{{tools.token}}"
                  newPassword: "{{tools.new_password}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: passwordless
          path: /recipe/signinup
          description: "Passwordless OTP and magic link auth"
          operations:
            - name: create-passwordless-code
              method: POST
              description: "Create passwordless OTP or magic link"
              body:
                type: json
                data:
                  email: "{{tools.email}}"
                  phoneNumber: "{{tools.phone_number}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: consume-passwordless-code
              method: POST
              description: "Consume passwordless code to authenticate"
              body:
                type: json
                data:
                  preAuthSessionId: "{{tools.pre_auth_session_id}}"
                  userInputCode: "{{tools.otp_code}}"
                  deviceId: "{{tools.device_id}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: third-party-signinup
              method: POST
              description: "Sign in or up via OAuth provider"
              body:
                type: json
                data:
                  thirdPartyId: "{{tools.provider_id}}"
                  thirdPartyUserId: "{{tools.provider_user_id}}"
                  email: "{{tools.email_object}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: email-verification
          path: /recipe/user/email
          description: "Email verification management"
          operations:
            - name: create-email-verification-token
              method: POST
              description: "Generate email verification token"
              body:
                type: json
                data:
                  userId: "{{tools.user_id}}"
                  email: "{{tools.email}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: verify-email
              method: POST
              description: "Verify email using verification token"
              body:
                type: json
                data:
                  method: "token"
                  token: "{{tools.token}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: is-email-verified
              method: GET
              description: "Check if user email is verified"
              inputParameters:
                - name: userId
                  in: query
                  type: string
                  required: true
                  description: "User ID"
                - name: email
                  in: query
                  type: string
                  required: true
                  description: "Email address"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: user-metadata
          path: /recipe/user/metadata
          description: "User metadata storage"
          operations:
            - name: get-user-metadata
              method: GET
              description: "Get custom metadata for a user"
              inputParameters:
                - name: userId
                  in: query
                  type: string
                  required: true
                  description: "User ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-user-metadata
              method: PUT
              description: "Update user metadata (shallow merge)"
              body:
                type: json
                data:
                  userId: "{{tools.user_id}}"
                  metadataUpdate: "{{tools.metadata}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-user-metadata
              method: DELETE
              description: "Delete all metadata for a user"
              inputParameters:
                - name: userId
                  in: query
                  type: string
                  required: true
                  description: "User ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: multi-tenancy
          path: /recipe/multitenancy
          description: "Multi-tenant configuration"
          operations:
            - name: create-or-update-tenant
              method: POST
              description: "Create or update tenant configuration"
              body:
                type: json
                data:
                  tenantId: "{{tools.tenant_id}}"
                  emailPasswordEnabled: "{{tools.email_password_enabled}}"
                  passwordlessEnabled: "{{tools.passwordless_enabled}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-tenants
              method: GET
              description: "List all configured tenants"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: users
          path: /users
          description: "User management"
          operations:
            - name: list-users
              method: GET
              description: "List all users with pagination"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Max users to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-user
              method: DELETE
              description: "Permanently delete a user"
              inputParameters:
                - name: userId
                  in: query
                  type: string
                  required: true
                  description: "User ID to delete"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: user-roles
          path: /recipe/user/roles
          description: "Role-based access control"
          operations:
            - name: assign-role-to-user
              method: PUT
              description: "Assign a role to a user"
              body:
                type: json
                data:
                  userId: "{{tools.user_id}}"
                  role: "{{tools.role}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-user-roles
              method: GET
              description: "Get all roles for a user"
              inputParameters:
                - name: userId
                  in: query
                  type: string
                  required: true
                  description: "User ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: remove-user-role
              method: DELETE
              description: "Remove a role from a user"
              inputParameters:
                - name: userId
                  in: query
                  type: string
                  required: true
                  description: "User ID"
                - name: role
                  in: query
                  type: string
                  required: true
                  description: "Role to remove"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: supertokens-cdi-api
      resources:
        - path: /v1/sessions
          name: sessions
          description: "Session management"
          operations:
            - method: POST
              name: create-session
              description: "Create a new session"
              call: "supertokens-cdi.create-session"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/users
          name: users
          description: "User management"
          operations:
            - method: GET
              name: list-users
              description: "List all users"
              call: "supertokens-cdi.list-users"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: supertokens-cdi-mcp
      transport: http
      tools:
        - name: create-session
          description: "Create a new authentication session for a user"
          hints:
            readOnly: false
            idempotent: false
          call: "supertokens-cdi.create-session"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-session
          description: "Verify and retrieve a session from an access token"
          hints:
            readOnly: true
            idempotent: true
          call: "supertokens-cdi.get-session"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-users
          description: "List all users with pagination"
          hints:
            readOnly: true
            idempotent: true
          call: "supertokens-cdi.list-users"
          outputParameters:
            - type: object
              mapping: "$."
