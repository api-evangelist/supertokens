naftiko: 1.0.0-alpha2
info:
  label: SuperTokens Core Driver Interface — Users
  description: 'SuperTokens Core Driver Interface — Users. 2 operations. Lead operation: Delete User. Self-contained Naftiko
    capability covering one Supertokens business surface.'
  tags:
  - Supertokens
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPERTOKENS_API_KEY: SUPERTOKENS_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-driver-interface-users
    baseUri: http://{host}:{port}
    description: SuperTokens Core Driver Interface — Users business capability. Self-contained, no shared references.
    resources:
    - name: user-remove
      path: /user/remove
      operations:
      - name: deleteuser
        method: DELETE
        description: Delete User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: userId
          in: query
          type: string
          description: User ID to delete
          required: true
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of users to return
        - name: paginationToken
          in: query
          type: string
          description: Pagination token from previous response
        - name: includeRecipeIds
          in: query
          type: string
          description: Comma-separated list of recipe IDs to filter by
    authentication:
      type: apikey
      key: api-key
      value: '{{env.SUPERTOKENS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: core-driver-interface-users-rest
    port: 8080
    description: REST adapter for SuperTokens Core Driver Interface — Users. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/user/remove
      name: user-remove
      description: REST surface for user-remove.
      operations:
      - method: DELETE
        name: deleteuser
        description: Delete User
        call: core-driver-interface-users.deleteuser
        with:
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: List Users
        call: core-driver-interface-users.listusers
        with:
          limit: rest.limit
          paginationToken: rest.paginationToken
          includeRecipeIds: rest.includeRecipeIds
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-driver-interface-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for SuperTokens Core Driver Interface — Users. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: delete-user
      description: Delete User
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: core-driver-interface-users.deleteuser
      with:
        userId: tools.userId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-users
      description: List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-driver-interface-users.listusers
      with:
        limit: tools.limit
        paginationToken: tools.paginationToken
        includeRecipeIds: tools.includeRecipeIds
      outputParameters:
      - type: object
        mapping: $.
