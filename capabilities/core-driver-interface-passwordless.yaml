naftiko: 1.0.0-alpha2
info:
  label: SuperTokens Core Driver Interface — Passwordless
  description: 'SuperTokens Core Driver Interface — Passwordless. 2 operations. Lead operation: Create Passwordless Code.
    Self-contained Naftiko capability covering one Supertokens business surface.'
  tags:
  - Supertokens
  - Passwordless
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPERTOKENS_API_KEY: SUPERTOKENS_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-driver-interface-passwordless
    baseUri: http://{host}:{port}
    description: SuperTokens Core Driver Interface — Passwordless business capability. Self-contained, no shared references.
    resources:
    - name: recipe-signinup-code
      path: /recipe/signinup/code
      operations:
      - name: createpasswordlesscode
        method: POST
        description: Create Passwordless Code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: recipe-signinup-code-consume
      path: /recipe/signinup/code/consume
      operations:
      - name: consumepasswordlesscode
        method: POST
        description: Consume Passwordless Code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: api-key
      value: '{{env.SUPERTOKENS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: core-driver-interface-passwordless-rest
    port: 8080
    description: REST adapter for SuperTokens Core Driver Interface — Passwordless. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/recipe/signinup/code
      name: recipe-signinup-code
      description: REST surface for recipe-signinup-code.
      operations:
      - method: POST
        name: createpasswordlesscode
        description: Create Passwordless Code
        call: core-driver-interface-passwordless.createpasswordlesscode
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/recipe/signinup/code/consume
      name: recipe-signinup-code-consume
      description: REST surface for recipe-signinup-code-consume.
      operations:
      - method: POST
        name: consumepasswordlesscode
        description: Consume Passwordless Code
        call: core-driver-interface-passwordless.consumepasswordlesscode
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-driver-interface-passwordless-mcp
    port: 9090
    transport: http
    description: MCP adapter for SuperTokens Core Driver Interface — Passwordless. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: create-passwordless-code
      description: Create Passwordless Code
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-driver-interface-passwordless.createpasswordlesscode
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: consume-passwordless-code
      description: Consume Passwordless Code
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-driver-interface-passwordless.consumepasswordlesscode
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
